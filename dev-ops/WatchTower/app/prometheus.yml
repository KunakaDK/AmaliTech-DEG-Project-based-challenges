global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["${ORDER_SERVICE_NAME}:${ORDER_SERVICE_PORT}"]

  - job_name: tracking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["${TRACKING_SERVICE_NAME}:${TRACKING_SERVICE_PORT}"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["${NOTIFICATION_SERVICE_NAME}:${NOTIFICATION_SERVICE_PORT}"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: ["http://${ORDER_SERVICE_NAME}:${ORDER_SERVICE_PORT}/health"]
        labels:
          service: order-service
      - targets: ["http://${TRACKING_SERVICE_NAME}:${TRACKING_SERVICE_PORT}/health"]
        labels:
          service: tracking-service
      - targets: ["http://${NOTIFICATION_SERVICE_NAME}:${NOTIFICATION_SERVICE_PORT}/health"]
        labels:
          service: notification-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
