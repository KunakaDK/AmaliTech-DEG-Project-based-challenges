global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:3001"]

  - job_name: tracking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["tracking-service:3002"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:3003"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: ["http://order-service:3001/health"]
        labels:
          service: order-service
      - targets: ["http://tracking-service:3002/health"]
        labels:
          service: tracking-service
      - targets: ["http://notification-service:3003/health"]
        labels:
          service: notification-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
